services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawassist_frontend
    environment:
      - VITE_API_URL=http://localhost:5000/api/
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawassist_backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://root:root@postgres:5432/lawassist_db?sslmode=disable
      - FRONTEND_URL=http://localhost:5173
      - PORT=5000
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: lawassist_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lawassist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: