services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawassist_frontend
    environment:
      - VITE_API_URL=http://localhost:5000/api/
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawassist_backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://root:root@postgres:5432/lawassist_db?sslmode=disable
      - FRONTEND_URL=http://localhost:5173
      - PORT=5000
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379 
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - postgres
      - rabbitmq
      - redis 
    networks:
      - lawassist_network    

  postgres:
    image: postgres:17-alpine
    container_name: lawassist_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lawassist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lawassist_network    

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lawassist_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - lawassist_network

  redis:
    image: redis:7-alpine
    container_name: lawassist_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lawassist_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: lawassist_redisinsight
    restart: always
    ports:
      - "5540:5540"
    networks:
      - lawassist_network

  worker:
    build: ./backend
    container_name: lawassist_worker
    command: node consumer.js
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
    env_file:
      - ./backend/.env
    networks:
      - lawassist_network
    restart: on-failure

volumes:
  postgres_data:

networks:
  lawassist_network:
    driver: bridge